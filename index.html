<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NAPKINS ARTS PRODUCTION 공유 메모 보드">
  <title>NAP Work Sharing</title>
  <link rel="icon" type="image/jpeg" href="./favicon.jpg">
  <link rel="apple-touch-icon" href="./favicon.jpg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="top-note">
    <time id="today" class="today"></time>
    <input id="daily-text" class="daily-text" type="text" aria-label="오늘의 문구" placeholder="오늘의 문구를 입력하세요" autocomplete="off">
  </header>

  <main class="memos">
    <section class="memo" data-memo="0">
      <input class="memo-title" type="text" aria-label="왼쪽 메모 제목" placeholder="제목" autocomplete="off">
      <div class="memo-content" contenteditable="true" role="textbox" aria-multiline="true" aria-label="왼쪽 메모 내용" data-placeholder="내용을 입력하세요" spellcheck="true"></div>
    </section>

    <div class="center-column">
      <section class="memo" data-memo="1">
        <div class="name-row">
          <label class="photo-picker" title="사진 선택">
            <input class="photo-input" type="file" accept="image/*" aria-label="가운데 위 사진 선택">
            <img class="photo-preview" alt="">
            <span class="photo-placeholder">+</span>
          </label>
          <input class="memo-title" type="text" aria-label="가운데 위 이름" placeholder="이름" autocomplete="off">
        </div>
        <div class="memo-content" contenteditable="true" role="textbox" aria-multiline="true" aria-label="가운데 위 내용" data-placeholder="내용을 입력하세요" spellcheck="true"></div>
      </section>

      <section class="memo" data-memo="3">
        <div class="name-row">
          <label class="photo-picker" title="사진 선택">
            <input class="photo-input" type="file" accept="image/*" aria-label="가운데 아래 사진 선택">
            <img class="photo-preview" alt="">
            <span class="photo-placeholder">+</span>
          </label>
          <input class="memo-title" type="text" aria-label="가운데 아래 이름" placeholder="이름" autocomplete="off">
        </div>
        <div class="memo-content" contenteditable="true" role="textbox" aria-multiline="true" aria-label="가운데 아래 내용" data-placeholder="내용을 입력하세요" spellcheck="true"></div>
      </section>
    </div>

    <section class="memo" data-memo="2">
      <input class="memo-title" type="text" aria-label="오른쪽 메모 제목" placeholder="제목" autocomplete="off">
      <div class="memo-content" contenteditable="true" role="textbox" aria-multiline="true" aria-label="오른쪽 메모 내용" data-placeholder="내용을 입력하세요" spellcheck="true"></div>
    </section>
  </main>

  <div id="save-status" class="save-status" role="status" aria-live="polite">연결 중...</div>
  <footer class="production-credit"><span>NAPKINS ARTS PRODUCTION</span></footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
